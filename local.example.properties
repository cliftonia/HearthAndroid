# Copy to local.properties (which git ignores) and fill in. Android Studio writes sdk.dir itself.
sdk.dir=/path/to/Android/sdk

# The addresses the app starts with. Leave them out and the app asks in Settings on first launch.
hearth.ollamaAddress=https://my-server.example.ts.net
hearth.searchAddress=https://my-server.example.ts.net:8888

# Optional: your own application id, if you publish or sign the app yourself.
# hearth.applicationId=com.example.hearth
hearth.speechAddress=http://my-server.example.ts.net:8880

# Optional: where pictures are made, a ComfyUI server. Leave it out and the app offers no pictures.
# hearth.imageAddress=http://my-server.example.ts.net:8188

# Optional: the model the app starts with, by its name on the server.
# hearth.defaultModel=llama3.2:latest
