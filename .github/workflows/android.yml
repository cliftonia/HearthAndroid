# Builds the app, runs every unit test and lints it on each push and pull request.
#
# No local.properties is needed: app/build.gradle.kts reads it only if it exists, and every key it reads falls back
# to an empty address or the default application id. The SDK is found through ANDROID_HOME on the runner.
name: Android

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The domain and data modules are plain JVM modules, so their tests are `test`; the app's are per variant.
      - name: Test, lint and build
        run: ./gradlew :domain:test :data:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
